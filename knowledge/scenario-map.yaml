# SCENARIO MAP: one row per test case, and the pipeline's state machine.
#
# status: not_started | explored | in_progress | in_review | done | blocked
#   explored = a knowledge file covers every step; ready for Codegen
#   blocked  = cannot proceed; `blocker` must say why, in full
#
# /pw-automate adds rows. Codegen updates `status` and `files`.

meta:
  project: complystream-upload-tests
  app: https://the-internet.herokuapp.com/upload

scenarios:
  - id: TC-UPLOAD-001
    title: Upload a valid file using the file picker
    page: pages/upload
    status: done
    files:
      - pages/UploadPage.ts
      - tests/fixtures/index.ts
      - tests/upload/TC-UPLOAD-001-upload-form.spec.ts

  - id: TC-UPLOAD-002
    title: Submitting with no file selected shows a validation message
    page: pages/upload
    status: done
    # @known-defect DEFECT-001: the test fails red against the live app by design (C-DEFECT-1)
    files:
      - pages/UploadPage.ts
      - tests/upload/TC-UPLOAD-002-empty-submit.spec.ts

  - id: TC-UPLOAD-003
    title: Drop a file onto the drag-and-drop zone
    page: pages/upload
    status: done
    files:
      - pages/UploadPage.ts
      - tests/upload/TC-UPLOAD-003-drag-drop.spec.ts
