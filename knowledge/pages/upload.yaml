# Observed with Playwright MCP on 2026-10-27 by the Explorer agent (scope: TC-UPLOAD-001).
# First session: browser_file_upload refused the fixture (the MCP allowed roots pointed at another
# project). Second session, the same day and run from this repo: browser_file_upload accepted
# C:\Users\suhas\complystream-upload-tests\tests\fixtures\files\sample.txt, and the file-chosen
# and successful-submit states were observed. Drag-and-drop is still unobserved (out of scope).
# Third session, 2026-10-27 (scope: TC-UPLOAD-002, empty-submit page only, no file uploaded):
# re-observed the empty submit (POST /upload -> 500 again) and recorded the error heading and the
# validation message as elements, plus which form elements are absent from the error page.
# Fourth session, 2026-10-28 (scope: TC-UPLOAD-003, drag-and-drop only): produced a real drop on
# #drag-drop-upload with browser_evaluate (no browser_file_upload, no setInputFiles, no click on
# the zone). The File was built in-page from the exact 72 bytes of tests/fixtures/files/sample.txt
# (read from disk, base64 Q29tcGx5U3RyZWFtIHVwbG9hZCB0ZXN0IGZpeHR1cmUuIEhhcm1sZXNzIHBsYWluIHRleHQsIHNhZmUgdG8gcHVibGlzaC4K).
# Dropped twice on two fresh loads: dragenter+dragover+drop, then drop alone. Both uploaded.
# Fifth session, 2026-10-29 (scope: TC-UPLOAD-004 steps 1-2, file-chooser form flow only, no drop):
# clicked 'Choose File', passed the committed fixture
# C:\Users\suhas\complystream-upload-tests\tests\fixtures\files\résumé final (v2).txt (89 bytes; the
# on-disk name bytes are 72 c3a9 73 75 6d c3a9 20 ... i.e. NFC) to browser_file_upload, which
# accepted it without altering the name, then clicked 'Upload'. Recorded files[0].name before
# submit and #uploaded-files after submit, with code points (see states.unicode_name_*).

page: upload
title: File Uploader
url: /upload
last_observed: 2026-10-29
observed_on: "https://the-internet.herokuapp.com (no version string visible; footer says 'Powered by Elemental Selenium and Sauce Labs')"
first_load_ms: 5606  # The largest first load seen. Navigation Timing duration of the first GET /upload in the fourth session, 2026-10-28 (responseStart 773 ms, 200; most of the time was after the first byte). Earlier sessions measured 2823 ms (responseStart 776 ms) and 865 ms (responseStart 708 ms); the fifth session (2026-10-29) measured 1157 ms (responseStart 794 ms, 200). Whether any hit a cold dyno is unknown, so this is not a confirmed cold-start figure.

elements:
  - name: heading
    locator: "page.getByRole('heading', { name: 'File Uploader', level: 3 })"
    why: "Snapshot shows heading \"File Uploader\" [level=3]; role + name is the first choice (C-LOC-1)."
    attributes: "<h3> with no attributes"
    notes: "Only on the form page. The empty-submit error page and the success page reuse the same h3 position with different text (see elements.empty_submit_error_heading and elements.result_heading), so assert the name, not just the role."

  - name: file_input
    locator: "page.locator('#file-upload')"
    why: "Snapshot exposes it only as button \"Choose File\". That is the browser's native button text, not an author-supplied name, and there are 0 <label> elements on the page. Fall back to the stable DOM id (C-LOC-2)."
    attributes: 'id="file-upload" type="file" name="file" (no accept, no multiple)'
    notes: "There are TWO input[type=file] on the page. Use '#file-upload'. A bare 'input[type=file]' matches both and triggers a strict-mode violation (see gotchas). After sample.txt is chosen, the snapshot still shows button \"Choose File\"; the chosen file name appears only as native text beside it (screenshot)."

  - name: upload_button
    locator: "page.getByRole('button', { name: 'Upload' })"
    why: "Snapshot shows button \"Upload\". Playwright MCP itself generated this locator when clicked (C-LOC-1)."
    attributes: 'class="button" id="file-submit" type="submit" value="Upload"'
    notes: "#file-submit is a stable fallback."

  - name: upload_form
    locator: "page.locator('form')"
    why: "No role or name in the snapshot. The page has exactly 1 <form>. Only needed if a test inspects form attributes."
    attributes: 'method="POST" enctype="multipart/form-data" (no action attribute, so it submits to the document URL, /upload)'
    notes: "Both the empty submit and the successful submit were observed going to POST https://the-internet.herokuapp.com/upload."

  - name: drag_drop_zone
    locator: "page.locator('#drag-drop-upload')"
    why: "Absent from the accessibility snapshot (an empty div with no role or name), so role-based location is impossible. Fall back to the DOM id (C-LOC-2)."
    attributes: 'id="drag-drop-upload" class="dz-success-mark dz-clickable"; outerHTML before a drop is exactly <div class="dz-success-mark dz-clickable" id="drag-drop-upload">\n</div>; 400x400 px (x=316 in a 1600-wide viewport, x=148 in a 1280-wide one; y=358)'
    notes: "Renders as an empty box with a red dashed border below the Upload button. It is a Dropzone.js 4.0.1 instance (window.Dropzone.version '4.0.1', Dropzone.instances.length 1, element.dropzone set), created by the inline script $('div#drag-drop-upload').dropzone({ url: '/upload', previewTemplate: $('#preview-template').html() }). Effective options read from element.dropzone.options: url '/upload', method 'POST', paramName 'file', autoProcessQueue true, uploadMultiple false, parallelUploads 2, maxFilesize 256, acceptedFiles null, maxFiles null, clickable true, previewsContainer null (previews go inside the zone itself), withCredentials false. Class changes seen: dragenter/dragover add 'dz-drag-hover'; drop removes it and adds 'dz-started' (zone class after a drop: 'dz-success-mark dz-clickable dz-started'). Before a drop it is absent from the accessibility snapshot; after a drop it appears as an unnamed generic containing generic 'sample.txt' and generic '✔'."

  - name: dropzone_preview
    locator: "page.locator('#drag-drop-upload .dz-preview')"
    why: "Added by Dropzone inside the zone on drop. The snapshot shows it only as an unnamed generic (no role, no name, no id), so C-LOC-1 and C-LOC-2 are impossible. '.dz-preview' is the class Dropzone's own preview template uses, scoped to the zone id (C-LOC-3)."
    attributes: 'Built from the hidden #preview-template: <div class="dz-preview dz-file-preview"><div class="dz-details"><div class="dz-filename"><span data-dz-name></span></div></div><div class="dz-success-mark"><span>✔</span></div></div>. No size element ([data-dz-size] count 0), no error-message element ([data-dz-errormessage] / .dz-error-message count 0), no progress bar, no thumbnail.'
    notes: "Exactly 1 after one drop. Class sequence observed: immediately after the drop event 'dz-preview dz-file-preview'; once the upload finishes 'dz-preview dz-file-preview dz-processing dz-success dz-complete'. Assert the 'dz-success' class (e.g. toHaveClass(/\\bdz-success\\b/)) to prove acceptance; 'dz-error' was never seen. textContent is JSON \"\\n    \\n      sample.txt\\n    \\n    ✔\\n  \"; innerText is \"sample.txt\\n✔\"."

  - name: dropzone_file_name
    locator: "page.locator('#drag-drop-upload [data-dz-name]')"
    why: "Shown in the snapshot only as an unnamed generic with text 'sample.txt' (no role or name, C-LOC-1 impossible; no id, C-LOC-2 impossible). [data-dz-name] is the attribute Dropzone fills with the file name (C-LOC-3), scoped to the zone."
    attributes: '<span data-dz-name="">sample.txt</span>, inside div.dz-filename inside div.dz-details'
    notes: "textContent and innerText are both exactly 'sample.txt' (no surrounding whitespace), so an exact toHaveText('sample.txt') matches. After the drop it is the ONLY element on the page whose own text contains 'sample.txt' (the file chooser's 'No file chosen' is native and not in the DOM), so getByText('sample.txt', { exact: true }) would also resolve to it, but the scoped locator is safer if the form flow is ever exercised in the same test. The name is filled immediately on drop (before the request completes)."

  - name: dropzone_success_mark
    locator: "page.locator('#drag-drop-upload .dz-preview .dz-success-mark')"
    why: "Unnamed generic '✔' in the snapshot (C-LOC-1/2 impossible). Must be scoped under .dz-preview because the zone itself also carries the class 'dz-success-mark' (C-LOC-3)."
    attributes: '<div class="dz-success-mark"><span>✔</span></div>; textContent and innerText exactly "✔"; computed display block, visibility visible, opacity 1'
    notes: "NOT evidence of success: it is static template markup, present and display:block immediately after the drop event, before the XHR completed and while the preview had no dz-success class. Use dropzone_preview's 'dz-success' class plus the POST /upload response instead."

  - name: dropzone_hidden_input
    locator: "page.locator('input.dz-hidden-input')"
    why: "Recorded so nobody targets it by accident. Has no id. The class is the only distinguishing attribute."
    attributes: 'type="file" multiple="multiple" class="dz-hidden-input" style="visibility: hidden; position: absolute; top: 0px; left: 0px; height: 0px; width: 0px;"'
    notes: "A direct child of <body>, outside the <form>. Not part of the file-picker flow. It still had files.length 0 after sample.txt was chosen through #file-upload, and also files.length 0 after a real drop on #drag-drop-upload (the drop path does not go through this input). Setting files on it is NOT the drop path (C-IO-3)."

  - name: result_heading
    locator: "page.getByRole('heading', { name: 'File Uploaded!', level: 3 })"
    why: "Snapshot of the result page shows heading \"File Uploaded!\" [level=3]; role + name is the first choice (C-LOC-1)."
    attributes: "<h3>File Uploaded!</h3> with no attributes; it is the only h1-h4 on the result page"
    notes: "Only present after a successful submit. The URL is still /upload, so this heading together with the POST status is what identifies the result page."

  - name: uploaded_files
    locator: "page.locator('#uploaded-files')"
    why: "The snapshot shows it only as an unnamed 'generic' with the text sample.txt, so it has no role or accessible name to target (C-LOC-1 not possible). It has a stable id, so fall back to the DOM id (C-LOC-2)."
    attributes: 'id="uploaded-files" class="panel text-center"; 0 child elements; text node only'
    notes: "textContent is JSON \"\\n    sample.txt\\n  \" (newline + 4 spaces before, newline + 2 spaces after); innerText is exactly 'sample.txt'. No other file names are present. Raw textContent equality fails; use toHaveText('sample.txt'), which normalises whitespace, or trim first. Only present after a successful submit. With the fixture 'résumé final (v2).txt' the same template wrapping applies (textContent JSON \"\\n    résumé final (v2).txt\\n  \", innerText exactly 'résumé final (v2).txt', still 0 child elements); the snapshot shows generic \"résumé final (v2).txt\". See states.unicode_name_successful_submit."

  - name: empty_submit_error_heading
    locator: "page.getByRole('heading', { name: 'Internal Server Error', level: 3 })"
    why: "Snapshot of the empty-submit page shows heading \"Internal Server Error\" [level=3]; role + name is the first choice (C-LOC-1)."
    attributes: "<h3>Internal Server Error</h3> with no attributes (no id, no class); it is the only h1-h6 on the error page"
    notes: "Only present after an empty submit (POST /upload -> 500). textContent and innerText are both exactly \"Internal Server Error\" (no surrounding whitespace). It sits where 'File Uploader' sits on the form page; see elements.heading. For TC-UPLOAD-002 step 3 a test asserting 'no server error' would expect this heading NOT to be visible."

  - name: empty_submit_message
    locator: "page.locator('#upload-error')"
    why: "Snapshot shows it only as an unnamed 'paragraph' (paragraph is not named from content, so getByRole('paragraph', { name }) cannot target it; C-LOC-1 not possible). It has a stable id, so fall back to the DOM id (C-LOC-2)."
    attributes: '<p id="upload-error"> with no class and no other attributes; 0 child elements (text node only); parent is <div class="example">'
    notes: "It is the only element whose text is 'No file was chosen. Please choose a file to upload.' and the only <p> on the error page. textContent and innerText are identical and verbatim \"No file was chosen. Please choose a file to upload.\" (no leading or trailing whitespace, no newlines), so an exact toHaveText with this string matches. Only present after an empty submit."

  - name: empty_submit_back_link
    locator: "page.getByRole('link', { name: 'Back to the File Uploader' })"
    why: "Snapshot shows link \"Back to the File Uploader\" (/url: /upload) on the empty-submit error page (C-LOC-1)."
    attributes: 'href="/upload"'
    notes: "Only present on the error page after an empty submit. NOT present on the success page."

states:
  - name: initial
    trigger: "GET /upload"
    request: "GET /upload -> 200"
    observed: "Page title 'The Internet'. Heading 'File Uploader' (h3). Paragraph 'Choose a file on your system and then click upload. Or, drag and drop a file into the area below.' Button 'Choose File' with native text 'No file chosen' beside it (visible in the screenshot, not in the snapshot). Button 'Upload'. An empty red-dashed drop zone below. #uploaded-files is NOT present."

  - name: file_chooser_opened_and_cancelled
    trigger: "Click 'Choose File', then cancel the file chooser without selecting a file"
    request: "none (no request to the-internet.herokuapp.com between the chooser opening and the cancel)"
    observed: "The click opens a native file chooser (Playwright modal state 'File chooser'). After cancelling, #file-upload has files.length 0 and value '', and the URL stays https://the-internet.herokuapp.com/upload."

  - name: file_chosen_not_submitted
    trigger: "Click 'Choose File', then set tests/fixtures/files/sample.txt in the file chooser"
    request: "none to the-internet.herokuapp.com. The only new request was a failed third-party Optimizely beacon (GET https://298279967.log.optimizely.com/event?...&n=engagement&... -> net::ERR_NAME_NOT_RESOLVED)."
    observed: "URL stays https://the-internet.herokuapp.com/upload. #file-upload has files.length 1 (name 'sample.txt', size 72, type 'text/plain') and value 'C:\\fakepath\\sample.txt'. The native text beside 'Choose File' changes from 'No file chosen' to 'sample.txt' (screenshot only, not in the snapshot). input.dz-hidden-input has files.length 0. Nothing else on the page changes."

  - name: successful_submit
    trigger: "With sample.txt chosen, click 'Upload'"
    request: "POST https://the-internet.herokuapp.com/upload -> 200 (full-page form submit; the new document's Navigation Timing entry has type 'navigate', responseStatus 200, duration 297 ms)"
    observed: "URL after submit is https://the-internet.herokuapp.com/upload (unchanged). Page title 'The Internet'. #content holds only <div class=\"example\"> containing <h3>File Uploaded!</h3> and <div id=\"uploaded-files\" class=\"panel text-center\">, whose innerText is exactly 'sample.txt' (textContent has surrounding template whitespace; see elements.uploaded_files). No other file names. No other upload-related elements: 0 input[type=file], 0 <form>, no #drag-drop-upload, no Upload button, no back link."

  - name: unicode_name_file_chosen_not_submitted
    trigger: "Click 'Choose File', then browser_file_upload (fileChooser.setFiles) with C:\\Users\\suhas\\complystream-upload-tests\\tests\\fixtures\\files\\résumé final (v2).txt (fifth session, 2026-10-29)"
    request: "none to the-internet.herokuapp.com. The only new request was the known failing Optimizely 'engagement' beacon (net::ERR_NAME_NOT_RESOLVED)."
    observed: "browser_file_upload accepted the path and did not alter the name. #file-upload files.length 1; files[0].name 'résumé final (v2).txt' (length 21; code points U+0072 U+00E9 U+0073 U+0075 U+006D U+00E9 U+0020 U+0066 U+0069 U+006E U+0061 U+006C U+0020 U+0028 U+0076 U+0032 U+0029 U+002E U+0074 U+0078 U+0074; name.normalize('NFC') === name true, normalize('NFD') === name false, so the accent is U+00E9 precomposed, matching the NFC name on disk); size 89; type 'text/plain'; value 'C:\\fakepath\\résumé final (v2).txt'. Native text beside 'Choose File' reads 'résumé final (v2).txt' (screenshot only). input.dz-hidden-input files.length 0. URL stays /upload."

  - name: unicode_name_successful_submit
    trigger: "With 'résumé final (v2).txt' chosen through #file-upload, click 'Upload' (getByRole('button', { name: 'Upload' }))"
    request: "POST https://the-internet.herokuapp.com/upload -> 200 (full-page form submit; Navigation Timing type 'navigate', responseStatus 200, duration 374 ms). Only GET /upload -> 200 and this POST were seen to /upload. Request body and headers not captured."
    observed: "URL stays https://the-internet.herokuapp.com/upload. Only heading is <h3>File Uploaded!</h3>. #uploaded-files outerHTML exactly <div id=\"uploaded-files\" class=\"panel text-center\">\\n    résumé final (v2).txt\\n  </div> (0 child elements). innerText 'résumé final (v2).txt' (JSON \"résumé final (v2).txt\"), length 21, code points identical to files[0].name above (both é are U+00E9; spaces U+0020; parentheses U+0028/U+0029); innerText.normalize('NFC') === innerText true, NFD false. textContent JSON \"\\n    résumé final (v2).txt\\n  \". Checked in-page: innerText === 'résumé final (v2).txt' true; textContent.trim() === it true; whitespace-collapsed textContent === it true; textContent contains '%20' false, '?' false, 'Ã' (UTF-8-as-Latin-1 mojibake) false, U+00A0 false. document.characterSet 'UTF-8', contentType 'text/html'. Console: only the known Optimizely ERR_NAME_NOT_RESOLVED and /favicon.ico 404 errors."

  - name: empty_submit
    trigger: "Click 'Upload' with no file chosen"
    request: "POST https://the-internet.herokuapp.com/upload -> 500 (observed twice: first in the TC-UPLOAD-001 session, again on 2026-10-27 in the TC-UPLOAD-002 session, where the new document's Navigation Timing entry had type 'navigate', responseStatus 500, duration 480 ms). The second observation matches the first."
    observed: "URL stays https://the-internet.herokuapp.com/upload. Page title 'The Internet'. #content holds only <div class=\"example\"> containing <h3>Internal Server Error</h3>, <p id=\"upload-error\">No file was chosen. Please choose a file to upload.</p> and <a href=\"/upload\">Back to the File Uploader</a>. Link 'Back to the File Uploader' returns to the initial state (first session). ABSENT on this page: the 'File Uploader' heading (the only text containing 'File Uploader' is the back link), #file-upload (0 input[type=file]), the Upload button (no #file-submit, no button or submit input), any <form>, and #drag-drop-upload."

  - name: drag_drop
    trigger: "Dispatch a real drop of sample.txt on #drag-drop-upload: in the page, build File([72 fixture bytes], 'sample.txt', { type: 'text/plain' }), add it to a new DataTransfer, then zone.dispatchEvent(new DragEvent(type, { bubbles: true, cancelable: true, dataTransfer })) for 'dragenter', 'dragover', 'drop' in that order. Dropzone called preventDefault on all three. A second run dispatching 'drop' ALONE (no dragenter/dragover) uploaded identically, so dragenter/dragover are not required. No Upload click, no file chooser, no hidden-input setInputFiles. Playwright equivalent: const dt = await page.evaluateHandle(b64 => { const d = new DataTransfer(); d.items.add(new File([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], 'sample.txt', { type: 'text/plain' })); return d; }, base64OfFixture); await zone.dispatchEvent('drop', { dataTransfer: dt }); (the MCP run used page.evaluate with new DragEvent directly; the evaluateHandle + locator.dispatchEvent form is the standard Playwright equivalent and was not itself run in this session)."
    request: "Exactly one request to the app: POST https://the-internet.herokuapp.com/upload -> 200, sent by Dropzone as an XMLHttpRequest (Resource Timing initiatorType 'xmlhttprequest'; NOT a navigation: the page kept its single Navigation Timing entry, type 'navigate'). Sent by the drop alone, about 14-15 ms after it. Configured paramName 'file' (the same field name as #file-upload); the request headers and body were not captured, so the multipart Content-Type is NOT YET OBSERVED. Response: content-type 'text/html;charset=utf-8', content-length 1764, and the body is the normal success page (<h3>File Uploaded!</h3>, #uploaded-files textContent \"\\n    sample.txt\\n  \"), which shows the server received a file named sample.txt. Dropzone discards that HTML; it is not rendered."
    observed: "Dropzone events: addedfile at +2 ms, sending at +14 ms, success and complete at +350 ms (xhr.status 200, file.status 'success', file.accepted true), queuecomplete at +351 ms. Second run (drop only): preview reached 'dz-complete' 256 ms after the drop. In the zone: one .dz-preview, final class 'dz-preview dz-file-preview dz-processing dz-success dz-complete'; [data-dz-name] text exactly 'sample.txt'; '✔' mark (present from the moment of the drop, see elements.dropzone_success_mark); no size, no error message, no 'dz-error' class. Zone class becomes 'dz-success-mark dz-clickable dz-started'. Rest of the page unchanged: URL still https://the-internet.herokuapp.com/upload, h3 list exactly ['File Uploader'], #file-upload files.length 0 and value '' (screenshot still shows native 'No file chosen'), #file-submit present with value 'Upload', #uploaded-files absent, input.dz-hidden-input files.length 0. Console: only the known Optimizely ERR_NAME_NOT_RESOLVED and /favicon.ico 404 errors; nothing from Dropzone."

gotchas:
  - "Two file inputs exist: '#file-upload' (in the form) and a hidden Dropzone 'input.dz-hidden-input' (multiple, outside the form, under <body>). 'input[type=file]' matches both. Always use '#file-upload' for the picker flow."
  - "The file input's snapshot name 'Choose File' is the browser's native button label, not author markup (0 <label> elements). It may differ across browsers or locales, so locate by '#file-upload', not by getByRole('button', { name: 'Choose File' })."
  - "An empty submit returns HTTP 500, not a 4xx or an inline validation message. A test asserting only the page text would miss the 500, and a test asserting only status would miss the message. Assert both."
  - "Success and failure both end on URL /upload (POST /upload -> 200 vs -> 500). A URL assertion proves nothing. Assert the POST /upload response status plus the 'File Uploaded!' heading."
  - "On the empty-submit page the only text containing 'File Uploader' is the link 'Back to the File Uploader'. A loose getByText('File Uploader') matches that link, so it would wrongly 'prove' the user is still on the form. Use getByRole('heading', { name: 'File Uploader' }) (absent on the error page) or #file-upload (absent too)."
  - "#uploaded-files textContent includes template whitespace around the file name (seen for 'sample.txt' and 'résumé final (v2).txt'). Use toHaveText('<name>'), which normalises whitespace, or trim before an exact comparison. Do not compare raw textContent. The name's internal single spaces are plain U+0020, so whitespace normalisation does not change 'résumé final (v2).txt'."
  - "Unicode normalisation: the app echoed 'résumé final (v2).txt' with é as precomposed U+00E9 (NFC), the same as the on-disk name and files[0].name. Write the expected string in the spec as NFC (or build it with '\\u00e9'); an NFD literal (e + U+0301) would look identical but fail toHaveText. The fixture's filename on disk was NFC on this Windows checkout (bytes c3a9 for each é); behaviour with a filesystem that returns NFD is NOT YET OBSERVED."
  - "The success page has no link back to the form and no file input. A test that uploads twice must navigate to /upload again."
  - "The empty drop zone and the 'No file chosen' / chosen-file-name text do not appear in the accessibility snapshot. Use the DOM (#file-upload files) or screenshots for them. After a drop, the zone and its preview do appear, but only as unnamed generics, so role locators still cannot target them."
  - "The drop path is Dropzone's own XHR, NOT the form. setInputFiles / browser_file_upload on input.dz-hidden-input, or clicking the zone to open a chooser, exercise different code (C-IO-3). Produce a real drop: a DataTransfer carrying a File, dispatched as a 'drop' event on #drag-drop-upload (dragenter/dragover optional; drop alone worked)."
  - "The drop upload is an XHR, so the page does not navigate. Do not wait for navigation or for 'File Uploaded!'. Register page.waitForResponse(r => r.url().endsWith('/upload') && r.request().method() === 'POST') BEFORE dispatching the drop (the request leaves within ~15 ms), then assert status 200."
  - "The '✔' mark is static template markup, visible from the instant of the drop, before the server answers. It proves nothing. Assert the preview's 'dz-success' class (it was added ~250-350 ms after the drop)."
  - "The zone element itself has class 'dz-success-mark', the same class as the ✔ div inside each preview. A bare '.dz-success-mark' locator matches the zone too (2 elements after a drop). Scope it: '#drag-drop-upload .dz-preview .dz-success-mark'."
  - "The XHR response is the full success HTML page (content-type text/html). Dropzone treats any 2xx as success and ignores the body, so the zone shows no server-supplied text. If a test must prove the server stored the file, inspect the response body for #uploaded-files 'sample.txt'."
  - "Third-party Optimizely beacons (https://298279967.log.optimizely.com/event...) fail with net::ERR_NAME_NOT_RESOLVED on every page load and also on interaction (an 'engagement' beacon fired around choosing the file), plus /favicon.ico -> 404. These are console errors unrelated to the upload. Filter network assertions to the-internet.herokuapp.com/upload, and filter console errors before failing a test on them."

doc_discrepancies:
  - "Empty submit: the server answers HTTP 500 with heading 'Internal Server Error', yet the body text 'No file was chosen. Please choose a file to upload.' is a user validation message. A user would reasonably expect a validation response (inline or 4xx), not a server error. Recorded, not resolved."
  - "TC-UPLOAD-001 step 1 calls the file chooser 'Choose File'. That label is the native browser button text, not page markup (no <label>, no aria-label), so the test case's wording depends on the browser."

not_yet_observed:
  - "The POST /upload request body and response headers on a successful submit (only method, URL and status were recorded). For 'résumé final (v2).txt' the multipart Content-Disposition filename encoding (raw UTF-8 vs filename*) was not captured; only the rendered result was."
  - "Unicode-name upload via drag-and-drop, and a fixture whose on-disk name is NFD: neither was exercised (out of scope for TC-UPLOAD-004 steps 1-2; no NFD fixture is committed)."
  - "Unicode-name upload in Firefox or WebKit: only the MCP Chromium browser was used."
  - "Drag-and-drop request headers and body: the multipart Content-Type and the exact form field sent by Dropzone were not captured (only the configured paramName 'file' and the server's success response were seen)."
  - "Drag-and-drop with a real OS/mouse drag (Playwright dragTo from an external file is not possible; only a synthetic DragEvent with a DataTransfer was used). Also: dropping two files, dropping after a form upload, a drop that the server rejects (dz-error state), and WebKit/Firefox behaviour."
  - "The exact Playwright evaluateHandle + locator.dispatchEvent('drop', { dataTransfer }) form was not run in this session; the MCP run used page.evaluate with new DragEvent on the zone element."
  - "Behaviour with multiple files, large files, or restricted types: out of scope, and no such fixtures are committed."
