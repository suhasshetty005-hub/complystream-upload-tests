findings:
  - severity: blocker
    file: tests/upload/TC-UPLOAD-004-unicode-file-name.spec.ts
    line: 43
    convention_ref: "C-ASSERT-1 / Checklist A6 (loose assertion = correctness bug)"
    issue: >
      toHaveText(EXPECTED_NAME) with a string normalises BOTH sides before comparing. In the installed Playwright
      (node_modules/playwright-core/lib/coreBundle.js:562) that means text.replace(/[​­]/g, '').trim()
      .replace(/\s+/g, ' '). JavaScript's \s matches U+00A0 and the other Unicode spaces, so the internal spaces
      are NOT compared exactly. An echo of 'résumé final (v2).txt', 'résumé  final  (v2).txt' or a name with
      an inserted soft hyphen or zero-width space would all pass. The comment at spec:40-42 says the opposite
      ("toHaveText only normalises the template whitespace around the name ... internal spaces ... are unchanged").
      Regex expectations are not normalised (ExpectedTextMatcher.matches skips normalize when a regex is given).
    why_it_matters: >
      Spaces are half of what TC-UPLOAD-004 tests (the title says "File names with spaces and non-ASCII characters
      are preserved", and step 2 says "exactly as on disk"). Turning spaces into &nbsp; or collapsing them is a
      classic file-name encoding bug, and the knowledge file explicitly observed U+0020 (and no U+00A0). The core
      assertion cannot see that bug. not_generated[0] dropped the separate negative checks on the premise that the
      exact toHaveText rejects every mangling. For whitespace that premise is false.
    fix: >
      Make the name check whitespace-exact while still tolerating the template whitespace recorded in knowledge
      (textContent "\n    résumé final (v2).txt\n  "). Use a regex anchored on the whole textContent, built from the
      single EXPECTED_NAME so that NFC stays pinned:
      `const exactName = new RegExp('^\\s*' + EXPECTED_NAME.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$');`
      `await expect(uploadPage.uploadedFiles).toHaveText(exactName);`
      You may keep the string toHaveText first for its readable diff. Correct the comment at spec:40-42. Self-verify the fix:
      (a) BEFORE the fix, invert EXPECTED_NAME's space to ' ' in the string assertion and record that it
      PASSES (this proves the gap); (b) after the fix, the same inversion must FAIL; (c) revert and pass. Explorer
      (not Codegen): change the gotcha's "whitespace normalisation does not change 'résumé final (v2).txt'" to say
      that normalisation also applies to the received text, so an exact whitespace check needs a regex or innerText.

  - severity: suggestion
    file: tests/fixtures/index.ts
    line: 13
    convention_ref: "Checklist A8 (a stranger can tell what is going on from the code) / C-POM-4 (one way of doing each thing); batch-report accuracy is a rubric gap (conventions_silent_on)"
    issue: >
      The doc comment (index.ts:10-11) says the name is "Written with \u escapes so an editor cannot silently turn it
      into NFD". Line 13 is a literal UTF-8 'résumé' (bytes 303 251, verified with od -c). Batch report
      fixture_changes (:24-25) repeats the claim and quotes code that does not exist ('résumé ...'). The
      same name is also defined twice in two different ways: escaped in the spec (:10) and literal in the fixture map.
      The precondition (spec:20-21) checks the directory against EXPECTED_NAME only, so it does not guard the literal.
    why_it_matters: >
      Today the literal is NFC and correct, and any drift would fail loudly rather than pass falsely, so this is not a
      correctness bug. But the comment advertises a protection that is absent, and the batch report describes code
      that was not written. A reader cannot trust either one without running od.
    fix: >
      Change index.ts:13 to `unicodeNameTxt: path.join(__dirname, 'files', 'résumé final (v2).txt'),` so the
      comment becomes true, and add one line to the precondition step:
      `expect(path.basename(files.unicodeNameTxt), 'fixture path uses the NFC name').toBe(EXPECTED_NAME);`.
      Correct batch report fixture_changes to describe the code as it actually is (or as fixed), and say how it was
      checked (grep/od of the source line, not only of the directory listing).

conventions_silent_on:
  - "Unicode normalisation in expected strings: whether a spec must pin the observed form (NFC here) when the test case says only 'exactly as on disk', and whether non-ASCII literals must be written with \\u escapes. Ruled acceptable here because the knowledge observed NFC at disk, chooser and echo. Raised by Codegen."
  - "Whether a spec may read the filesystem (fs.readdirSync) in a precondition step that guards test data rather than app behaviour. Ruled acceptable here (C-LOC-5 is about locators; C-IO-1 and C-AGENT-10 are met). Raised by Codegen."
  - "C-ASSERT-1 permits toHaveText's whitespace normalisation where knowledge shows varying surrounding whitespace, but it does not say what to do when internal whitespace is part of the requirement (finding 1). A human may want to add: 'when spaces are part of the value under test, use an anchored regex or innerText'."
  - "Accuracy of descriptive claims in batch reports and code comments (fixture_changes and the index.ts doc comment here). C-AGENT-4 covers self_verify runs only. Carried from TC-UPLOAD-002 r2 and TC-UPLOAD-001 r4."
  - "Extra inversions beyond the one C-AGENT-4 requires (run_2b). Accepted as additional evidence. Related to the per-assertion falsifiability gap carried from TC-UPLOAD-002 r1 and TC-UPLOAD-003."
  - "Carried, still open: definition of 'core outcome' in C-ASSERT-1; app origin under configurable BASE_URL; batch-report vs scenario-map `status` naming; `exact: true` on fixed-name locators; the purpose of first_load_ms; multi-outcome known-defect tests; stub status/body choice; CI retries for @known-defect; asserting layout with boundingBox(); page objects reading fixture bytes."

