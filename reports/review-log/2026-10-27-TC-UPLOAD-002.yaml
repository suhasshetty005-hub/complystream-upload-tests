findings:
  - severity: suggestion
    file: tests/upload/upload-form.spec.ts
    line: 74
    convention_ref: "C-DEFECT-4 (in spirit) / C-TC-1; rubric gap, see conventions_silent_on[0]"
    issue: >
      Step 2 calls submit(), which waits for a POST /upload response. The test case allows two correct outcomes:
      "stays on the upload form" OR "a page that tells them to choose a file". A fix of the first kind (client-side
      validation such as `required`, no request sent) makes waitForResponse time out in step 2, so the test stays
      red after DEFECT-001 is fixed, with a timeout instead of the defect. Codegen disclosed this
      (batch not_generated[1], test_case_disagreements[1], conventions_silent_on[0]).
    why_it_matters: >
      A known-defect test is only useful if it turns green when the defect is fixed. Today it does so for one of
      the two specified fixes. A future red on a fixed app would read as "DEFECT-001 still open" to anyone who
      skims the annotation.
    fix: >
      Do not change the spec on Codegen's own initiative. Route the step-2 ambiguity to Doc-Gap (C-TC-1) so the
      product owner picks the required fix, and ask the human to rule on branching (conventions_silent_on[0]).
      If both outcomes must stay valid, a later batch can start a C-ASSERT-5 counter before the click and branch
      on it (0 POSTs -> assert the form is still shown plus an inline message, once the Explorer can observe one;
      1 POST -> today's steps 3-4). Until then, extend the annotation description to say "if this fails with a
      response timeout in step 2, the app may have switched to client-side validation; re-explore".

