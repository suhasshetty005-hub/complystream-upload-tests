conventions_silent_on:
  - "How a @known-defect test should handle a test case that allows more than one correct outcome (TC-UPLOAD-002 step 2: no request + stay on the form, OR a response page). C-DEFECT-3/4 assume one specified behaviour. Raised by Codegen too. A human should decide whether the test must branch (using C-ASSERT-5) or the test case must pick one outcome (Doc-Gap)."
  - "Whether C-DEFECT-3 self-verify must show that assertions which never run live can FAIL (e.g. a partial-fix stub), or only that the whole test can pass. The rule's stated aim ('not expect(false)') is met for the test as a whole, not per assertion."
  - "What status and body a C-DEFECT-3 stub should return when the test case does not pin them (raised by Codegen). This review judged 'observed defect page with only the defective parts changed' as fair. A human may want to write that down."
  - "Whether a known-defect test may pin the exact wording observed on the defective page (step 4, :88) when the test case only says 'a validation message tells the user a file is required'. C-ASSERT-1 pushes for exact text; the fix may legitimately reword it. No rule weighs the two."
  - "CI runs with retries: 1 (playwright.config.ts), so the deliberately failing test runs twice on CI and is reported failed after a retry. Not changed in this batch; the rubric says nothing about retries for @known-defect tests."
  - "Carried, still open: core-outcome definition in C-ASSERT-1; exact assertion for <input type=submit>; app origin under configurable BASE_URL; batch-report vs scenario-map `status` naming; `exact: true` on fixed-name locators; first_load_ms purpose."

meta_signal: >
  C-ASSERT-1 is now raised in a THIRD review log (TC-UPLOAD-001 round 1, round 3, and this one), which is more
  than two (C-AGENT-9). The cause is the same each time: toBeVisible on a named getByRole standing in for an
  exact check. agents/codegen-agent.md:47 says only "exact text where the knowledge file records exact text",
  which did not prevent it. Change the Codegen prompt (not the code): "check every named element with
  toHaveText / toHaveAccessibleName / toHaveValue; toBeVisible alone is allowed only as the presence half of a
  C-ASSERT-2 pair." Second signal: the known-defect rules (C-DEFECT-3/4) do not yet address multi-outcome test
  cases or per-assertion falsifiability; both came up in their first real use and are escalated above.
