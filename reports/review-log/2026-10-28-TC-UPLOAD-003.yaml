conventions_silent_on:
  - "Per-assertion falsifiability (carried from TC-UPLOAD-002 r1, now in a non-defect test): C-AGENT-4 requires one inverted core assertion. It does not say that the inversion must target the assertion that guards the test's distinguishing claim (here, the drop path rather than the form), or that a path mutation (swap the action, expect red) is the right proof for C-IO-3 tests. A human should decide whether to add 'for an input-path test, self-verify must include one run with the wrong path'."
  - "C-ASSERT-5 is written for proving that an action sent NO request (0, then a running total after a later known request). It does not cover 'exactly one request, and no second one' when the action under test is itself the request (step 4 here). The test reads the total after the following web-first waits, which closes the late-request window reasonably. Raised by Codegen; no rule says how long after the action the total must be read."
  - "Asserting layout or relative position (step 1, 'below the file chooser') with boundingBox(). C-LOC-3 forbids LOCATING by position, but no rule covers ASSERTING position, or whether such a check must be retrying (C-WAIT-2 only says 'prefer'). Raised by Codegen."
  - "Whether a page-object action may read fixture bytes from disk itself (fs.readFileSync in dropFile) rather than the fixture module supplying them. C-IO-1 is satisfied either way. Raised by Codegen."
  - "Whether a test may assert a non-user-visible signal (the 'dz-success' class) for an expected result worded in user terms ('the zone shows that the file was accepted'), when the knowledge file shows the only visible cue (✔) is not trustworthy. C-ASSERT-4 covers server vs page, not DOM-state vs perceivable state. Routed to Doc-Gap by Codegen; the reviewer agrees the class is the sound choice."
  - "Carried, still open: definition of 'core outcome' in C-ASSERT-1; app origin under configurable BASE_URL; batch-report vs scenario-map `status` naming; `exact: true` on fixed-name locators; the purpose of first_load_ms; multi-outcome known-defect tests; stub status/body choice; CI retries for @known-defect."

