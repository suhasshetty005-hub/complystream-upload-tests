findings:
  - severity: suggestion
    file: tests/upload/drag-drop.spec.ts
    line: 43
    convention_ref: "C-ASSERT-1 (assert the whole value: here the whole class token); Checklist A6"
    issue: >
      toHaveClass(/\bdz-success\b/) is not a whole-token match. '\b' treats '-' as a boundary, so the regex also
      matches 'dz-success-mark', a class this page puts on the zone itself and on the ✔ div (knowledge gotchas,
      elements.dropzone_success_mark). Today the preview element never carries 'dz-success-mark', so the test is
      correct now. The pattern is wrong for the purpose, and it was copied from the knowledge note
      (elements.dropzone_preview).
    why_it_matters: >
      If the preview template ever gains a 'dz-success-mark' class on the .dz-preview element (the class is
      already used twice on this page), step 3 would pass before the server answers. That is exactly the false
      acceptance signal the test avoids by not using the ✔.
    fix: >
      await expect(uploadPage.dropzonePreview).toContainClass('dz-success');  (Playwright 1.64.1 is installed, and
      toContainClass matches whole class tokens). Alternatively, use toHaveClass(/(^|\s)dz-success(\s|$)/). The
      Explorer should correct the same regex in knowledge elements.dropzone_preview notes.

  - severity: suggestion
    file: reports/codegen-batch-2026-10-28-TC-UPLOAD-003.yaml
    line: 81
    convention_ref: "C-AGENT-4 (met as written); per-assertion falsifiability is a rubric gap, see conventions_silent_on[0]"
    issue: >
      The one inversion (file name, step 3) proves that the step-3 check bites. It says nothing about step 2, which is
      the test's reason to exist: the upload happens through the drop, without the form or the Upload button. The
      checks that guard that claim, isNavigationRequest() false (spec:36) and the total count of 1 (spec:60),
      were only ever seen to pass. Inverting spec:36 to toBe(true) would add little, because it only re-shows the
      observed value.
    why_it_matters: >
      If a later edit made dropFile() fall back to chooseFile()+submit(), the zone checks in step 3 would fail first, so
      the test would still go red. But nothing on record shows that the step-2 guards alone distinguish the two paths.
      For a test whose case notes say "this is the mistake I expect the AI to make", that is the property most worth
      demonstrating.
    fix: >
      In the next self-verify of this test, add one temporary mutation run (do not commit it): in step 2, replace
      `uploadPage.dropFile(files.sampleTxt)` with `(await uploadPage.chooseFile(files.sampleTxt), await uploadPage.submit())`.
      Expect a failure at spec:36 ('the drop upload must not be a page navigation', Expected false, Received true).
      Record it as run_2b with the message. No spec change is needed.

  - severity: suggestion
    file: tests/upload/drag-drop.spec.ts
    line: 14
    convention_ref: "C-LOC-4 / Checklist A3 (trace to knowledge); C-WAIT-2 (prefer web-first)"
    issue: >
      The comment says knowledge records "the zone sits below the Upload button, which is below the file input". Knowledge
      records the zone's box (y=358, 400x400) and "below the Upload button", but no geometry for #file-upload. The
      file-input half is inferred. The check itself is a one-off boundingBox() read, not a retrying assertion.
    why_it_matters: >
      The assertion is correct today (the reviewer's run passed). But the test asserts a geometric fact that no
      observation backs directly, and a single snapshot could in principle be taken mid-layout (e.g. a late web
      font or banner shifting the form).
    fix: >
      Explorer: on the next session, record #file-upload's bounding box next to the zone's in elements.file_input /
      states.initial. Codegen: change the comment to cite only what is recorded. Optionally make the check retrying with
      `await expect.poll(async () => { const c = await uploadPage.fileInput.boundingBox(); const z = await uploadPage.dropZone.boundingBox(); return !!c && !!z && z.y >= c.y + c.height; }, { message: 'drop zone below the file chooser' }).toBe(true);`

  - severity: suggestion
    file: tests/upload/drag-drop.spec.ts
    line: 52
    convention_ref: "C-TC-3 / C-AGENT-5 (record what is not covered); route to Doc-Gap (C-TC-1)"
    issue: >
      Step 4's expected result is "the drop did not also submit or reset it". The "not submitted" half is well covered
      (count 1, no navigation, result page absent). The "not reset" half is vacuous: no file was chosen in the form, so
      toHaveValue('') is also the value after a reset. The batch report maps step 4 as covered and does not say that
