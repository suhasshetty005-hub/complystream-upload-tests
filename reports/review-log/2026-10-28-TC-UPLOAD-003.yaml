    why_it_matters: >
      A regression where a drop clears the form's chosen file would pass this test. Readers of the batch report would
      believe it is covered.
    fix: >
      Do not add a choose-file step on Codegen's initiative (the test case defines the steps, C-TC-1). Add a line to the
      batch report's not_generated: "'not reset' is not observable with an empty form; detecting it needs a file chosen
