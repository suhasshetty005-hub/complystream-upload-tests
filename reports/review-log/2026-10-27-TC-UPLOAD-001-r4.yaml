findings:
  - severity: suggestion
    file: reports/codegen-batch-2026-10-27-TC-UPLOAD-001.yaml
    line: 76
    convention_ref: "C-AGENT-4 (partly a rubric gap; see conventions_silent_on)"
    issue: >
      The fix-round-3 self_verify says "The finally block ran dispose() on that failure path." Nothing in the
      runs observed this. Run 2 recorded only the step-3 failure message. No run checked the listener count
      or showed any effect of dispose(). The statement is an inference from try/finally semantics. It is very
      likely true, because `finally` always runs when the try block throws, but it is worded as an
      observation. Codegen has flagged this itself.
    why_it_matters: >
      C-AGENT-4 asks for each run to be recorded in words. The value of that record is that a reader can trust
      every sentence in it as something that happened. One inferred statement worded as observed weakens trust in
      the rest of the record and sets a bad precedent for later batches, where the inference might be wrong.
      The core evidence (pass, invert, fail with the real message, revert, pass) is unaffected, so this is a
      suggestion, not a blocker.
    fix: >
      Reword the sentence as an inference, e.g. "dispose() is in a finally block, so by try/finally semantics
      it also runs on this failure path. This was not observed directly; no run inspected the listener." Do not
      add a run just to prove it; the rubric does not require observing a disposer (see conventions_silent_on).

conventions_silent_on:
  - "Whether a self_verify record may contain inferences (e.g. language semantics) alongside observations, and how they must be marked. C-AGENT-4 requires runs to be 'recorded in words' but does not explicitly require each claim to be observed. The suggestion above relies on the spirit of C-AGENT-4. A human may want to add 'state only what a run showed; label inferences as such'."
  - "Whether self-verification must exercise the NEGATIVE side of a tightened filter (that a POST /upload on another host is not counted). C-AGENT-4 requires one inverted core assertion, which was done. Proving the exclusion would need a stubbed foreign-origin request, and no rule asks for it."
  - "Carried from r3, still open: whether a returned disposer must be called on the failure path (try/finally). It is satisfied here anyway. Also carried: how a page object obtains the app origin under a configurable BASE_URL (derived from page.url() here); the definition of 'core outcome' in C-ASSERT-1; the exact assertion for <input type=submit> elements; batch-report vs scenario-map `status` naming; `exact: true` on fixed-name locators; the purpose of first_load_ms."

