  - "Step 2: 'the file is selected' is asserted through the input value 'C:\\fakepath\\sample.txt' recorded by the Explorer. The visible chosen-file-name text is native browser chrome and not in the accessibility tree, so it is not asserted."
  - "Step 2: 'nothing is sent to the server' is asserted as zero POST /upload requests, counted with a page.on('request') listener in UploadPage.trackUploadPosts(). The step-2 read is a snapshot taken after the input value assertion has settled. Since fix-round 2 the counter starts before the file is chosen and is read again after submit() in step 3 (expected exactly 1), so a POST fired late by choosing the file shows up as 2. Knowledge records no request at all on choose."
