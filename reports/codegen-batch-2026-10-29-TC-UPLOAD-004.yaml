  command: 'npx playwright test --grep "@tc:TC-UPLOAD-004" --retries=0'
  round_2_review_fix:   # 2026-10-29, applying review-log 2026-10-29-TC-UPLOAD-004 blocker 1 only
    a_gap_before_fix: >
      With the ORIGINAL string assertion, changed spec:43 to toHaveText(EXPECTED_NAME.replace(' ', '<U+00A0>'))
      (od -c of the line showed bytes 302 240 = U+00A0; the expected code points were
      72 e9 73 75 6d e9 a0 66 69 6e 61 6c 20 28 76 32 29 2e 74 78 74). PASSED (1 passed, 3.2s test / 4.0s total)
      against the page's plain U+0020 name. This proves the gap: the string form could not tell U+00A0 from U+0020.
      (One earlier attempt at this inversion is void: a sed escaping error inserted the literal text '00a0' rather
      than U+00A0. It was reverted from the backup with cmp IDENTICAL and is not counted.) Reverted from the
      backup: cmp IDENTICAL.
    b1_fixed_pass: "After the fix (anchored RegExp, spec:20 and spec:55): PASSED (1 passed, 3.2s test / 4.3s total). The test is now at spec:23:7."
    b2_nbsp_inversion_fails: >
      Changed spec:20 to escapeRegExp(EXPECTED_NAME.replace(' ', '\u00a0')) (od -c confirmed a single-backslash
      \u00a0 escape; a first edit had written '\\u00a0' and was corrected before the run). FAILED (13.1s) in step
