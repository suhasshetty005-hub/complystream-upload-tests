      Caveat: the message prints the U+00A0 as an ordinary space, so the difference cannot be seen in the output;
      the code points above are the evidence.
    b3_pct20_inversion_fails: >
      Restored the fixed spec (cmp IDENTICAL), then changed spec:20 to escapeRegExp(EXPECTED_NAME.replace(/ /g, '%20')).
      FAILED (15.2s) in step 2 at spec:55:48 with 'Error: expect(locator).toHaveText(expected) failed /
      Locator: locator('#uploaded-files') / Timeout: 10000ms / Expected pattern: /^[\n ]*résumé%20final%20\(v2\)\.txt[\n ]*$/ /
      Received string: "\n    résumé final (v2).txt\n  "', same call log.
    b4_reverted_pass: >
