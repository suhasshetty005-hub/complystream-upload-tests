not_generated:
  - >
    Separate negative checks for '%20', '?', mojibake and changed whitespace (for example not.toContainText('%20')).
    Corrected in round 2: the original premise was wrong. The string toHaveText rejected '%20', '?', mojibake and
    NFD, but NOT changes to whitespace, because it normalises the received text (U+00A0, doubled spaces, U+00AD and
    U+200B all passed; round_2_review_fix.a showed this for U+00A0). The core assertion is now the anchored RegExp,
    which compares the name code point by code point. round_2_review_fix.b2 (U+00A0) and b3 ('%20') show that it
    rejects both. Separate negative checks would still duplicate it, so they were left out. Doubled spaces, U+00AD
    and U+200B were not individually inverted; they are covered by the regex, not by a run.
  - >
    The multipart Content-Disposition filename encoding the browser sent (raw UTF-8 or filename*). This is
    NOT YET OBSERVED in the knowledge, and the test case asks only for the 2xx and the rendered name.
  - "Drag-and-drop with the Unicode name, an NFD-named fixture, and Firefox/WebKit: out of scope per the task and NOT YET OBSERVED in the knowledge."
  - "A POST /upload request counter (as in TC-UPLOAD-001): the test case does not ask whether choosing the file sends a request."

test_case_disagreements:   # for Doc-Gap; the test case was not edited (C-TC-1)
  - "Test data says the fixture is 'not committed yet'. It was committed in 0ec2f0c (tests/fixtures/files/résumé final (v2).txt), so this line is stale."
  - "'Automate: Not now ... time-boxed' and 'What would be needed: ... left out only because of the 4-hour cap' are stale now that the test is automated."
  - >
    Step 2 says "exactly as on disk" but does not say which Unicode normalisation form. The test pins NFC because
    the knowledge observed that form on disk, in the chooser and in the echo. A filesystem that returns NFD
    (macOS HFS+-style) is unobserved, and the precondition step would fail there rather than the name check.

conventions_silent_on:
  - >
    Unicode normalisation in expected strings. C-ASSERT-1 asks for exact text but says nothing about NFC vs NFD.
    The spec writes the literal with \u escapes, following the knowledge gotcha, not a rule.
  - "Whether a spec may read the filesystem (fs.readdirSync) for a precondition. C-LOC-5 covers locators only; this is not a locator."
  - "Extra inversions beyond the one C-AGENT-4 requires (run_2b). Recorded as additional evidence, not as a substitute."
