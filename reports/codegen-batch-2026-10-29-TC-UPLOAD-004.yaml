spec:
  title: "TC-UPLOAD-004: File names with spaces and non-ASCII characters are preserved"
  tags: ['@tc:TC-UPLOAD-004', '@upload']
  path: "file chooser / form only (chooseFile + submit). No drag-and-drop (C-IO-3)."
  grep_selection: "npx playwright test --list --grep @tc:TC-UPLOAD-004: 'Total: 1 test in 1 file', upload\\TC-UPLOAD-004-unicode-file-name.spec.ts:13:7 (C-TC-2)"

steps_mapped:
  - step: "precondition (not a test-case step)"
    to: >
      expect(fs.readdirSync(fixturesDir)).toContain(EXPECTED_NAME). This guards "exactly as on disk": if a
      checkout ever stored the name as NFD (NOT YET OBSERVED in the knowledge), the test fails here with a
      clear message, before it can fail confusingly at step 2.
  - step: 1
    to: >
      uploadPage.goto(); expect(heading).toHaveText('File Uploader'); uploadPage.chooseFile(files.unicodeNameTxt);
      expect(fileInput).toHaveValue('C:\\fakepath\\' + EXPECTED_NAME); const response = uploadPage.submit();
      status asserted 2xx (>= 200 and < 300, the test case's range; 200 observed) (C-ASSERT-4);
      expect(resultHeading).toHaveText('File Uploaded!')
  - step: 2
    to: >
      expect(uploadPage.uploadedFiles).toHaveText(EXACT_NAME_TEXT) (spec:55), where spec:20 is
      `const EXACT_NAME_TEXT = new RegExp('^[\\n ]*' + escapeRegExp(EXPECTED_NAME) + '[\\n ]*$');` and
      EXPECTED_NAME = 'r\u00e9sum\u00e9 final (v2).txt' (spec:10, \u escapes). Review r1 blocker 1 (C-ASSERT-1):
      the earlier toHaveText(EXPECTED_NAME) string form normalised the RECEIVED text too (coreBundle.js:562
      normalizeWhiteSpace: strip U+200B/U+00AD, trim, collapse /\s+/ to ' '), so a changed internal space passed
      (proven, self_verify.round_2_review_fix.a). A RegExp expectation is not normalised, so the name is compared
      code point by code point. The only slack is [\n ]* at each end: the template wrapping recorded in knowledge
      (elements.uploaded_files / states.unicode_name_successful_submit: textContent "\n    <name>\n  ").

